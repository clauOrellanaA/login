name: Cinco tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas de autenticacion y base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar frontend
        run: npm run build
      - name: Ejecutar cinco tests
        run: npm run test:actions
